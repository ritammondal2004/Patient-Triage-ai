services:
  # FastAPI application — Neon PostgreSQL is the database (cloud-hosted, not local)
  api:
    build: .
    container_name: patienttriage_api
    env_file: .env
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
    ports:
      - "8000:8000"
    # For local dev: use --reload for auto-restart on code changes
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
