name: OIDC Debug

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Get OIDC token claims
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_JSON=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$TOKEN_JSON")

          PAYLOAD=$(cut -d '.' -f2 <<< "$TOKEN" | tr '_-' '/+' | base64 -d 2>/dev/null || true)

          echo "OIDC claims:"
          python -m json.tool <<< "$PAYLOAD" 